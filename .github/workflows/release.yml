name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "Kill the Bill ${{ github.ref_name }}" \
              --latest
          else
            gh release create "${{ github.ref_name }}" \
              --title "Kill the Bill ${{ github.ref_name }}" \
              --generate-notes \
              --latest
          fi

      - name: Check signing secrets
        id: signing
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" ] \
            && [ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" ] \
            && [ -n "$APPLE_SIGNING_IDENTITY" ] \
            && [ -n "$APPLE_ID" ] \
            && [ -n "$APPLE_TEAM_ID" ] \
            && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are not configured; publishing source-only release for curl installer."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build release binary
        if: steps.signing.outputs.available == 'true'
        run: swift build -c release

      - name: Bundle .app
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: make bundle SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY"

      - name: Verify signature
        if: steps.signing.outputs.available == 'true'
        run: codesign --verify --deep --strict --verbose=2 .build/arm64-apple-macosx/release/KillTheBill.app

      - name: Zip app bundle for notarization
        if: steps.signing.outputs.available == 'true'
        run: |
          cd .build/arm64-apple-macosx/release
          ditto -c -k --keepParent KillTheBill.app KillTheBill.app.zip

      - name: Notarize app bundle
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit .build/arm64-apple-macosx/release/KillTheBill.app.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Staple notarization ticket
        if: steps.signing.outputs.available == 'true'
        run: |
          xcrun stapler staple .build/arm64-apple-macosx/release/KillTheBill.app
          xcrun stapler validate .build/arm64-apple-macosx/release/KillTheBill.app
          spctl --assess --type execute --verbose=4 .build/arm64-apple-macosx/release/KillTheBill.app

      - name: Zip notarized app bundle
        if: steps.signing.outputs.available == 'true'
        run: |
          cd .build/arm64-apple-macosx/release
          rm KillTheBill.app.zip
          ditto -c -k --keepParent KillTheBill.app KillTheBill.app.zip

      - name: Upload notarized app
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            .build/arm64-apple-macosx/release/KillTheBill.app.zip \
            --clobber

      - name: Delete temporary keychain
        if: always() && steps.signing.outputs.available == 'true'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
