name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Run tests
        run: swift test --enable-code-coverage

      - name: Check coverage
        run: |
          TEST_BINARY=$(find .build -path '*KillTheBillPackageTests.xctest/Contents/MacOS/KillTheBillPackageTests' -type f | head -n 1)
          xcrun llvm-cov report "$TEST_BINARY" \
            -instr-profile .build/debug/codecov/default.profdata \
            -ignore-filename-regex='Tests|/App/' | tee coverage.txt

      - name: Build release
        run: swift build -c release
