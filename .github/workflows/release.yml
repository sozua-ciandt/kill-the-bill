name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release

      - name: Bundle .app
        run: make bundle

      - name: Zip app bundle
        run: |
          cd .build/arm64-apple-macosx/release
          zip -r KillTheBill.app.zip KillTheBill.app

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            .build/arm64-apple-macosx/release/KillTheBill.app.zip \
            --title "Kill the Bill ${{ github.ref_name }}" \
            --generate-notes
