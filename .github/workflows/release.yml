name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: make test

      - name: Validate tag matches Info.plist version
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          test "$GITHUB_REF_NAME" = "v$release_version"
          test "$plist_version" = "$release_version"

      - name: Build and bundle application
        run: |
          set -euo pipefail
          make bundle
          app_bundle="$(make -s print-app-bundle)"
          test -d "$app_bundle/Contents/Resources/KillTheBill_KillTheBill.bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          printf 'APP_BUNDLE=%s\n' "$app_bundle" >> "$GITHUB_ENV"

      - name: Create release archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/KillTheBill.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "$archive"
          cd "$(dirname "$archive")"
          shasum -a 256 "$(basename "$archive")" > KillTheBill.app.zip.sha256
          printf 'APP_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'APP_CHECKSUM=%s\n' "$RUNNER_TEMP/KillTheBill.app.zip.sha256" >> "$GITHUB_ENV"

      - name: Validate final distributable
        run: |
          set -euo pipefail
          validation_dir="$RUNNER_TEMP/release-validation"
          mkdir -p "$validation_dir"
          ditto -x -k "$APP_ARCHIVE" "$validation_dir"
          validated_app="$validation_dir/KillTheBill.app"
          test -x "$validated_app/Contents/MacOS/KillTheBill"
          test -d "$validated_app/Contents/Resources/KillTheBill_KillTheBill.bundle"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$validated_app/Contents/Info.plist")" \
            = 'dev.sozua-ciandt.kill-the-bill'
          codesign --verify --deep --strict --verbose=2 "$validated_app"
          cd "$(dirname "$APP_ARCHIVE")"
          shasum -a 256 -c "$APP_CHECKSUM"

      - name: Create draft release with validated assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate it." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$APP_ARCHIVE#KillTheBill.app.zip" \
            "$APP_CHECKSUM#KillTheBill.app.zip.sha256" \
            --draft \
            --verify-tag \
            --title "Kill the Bill $GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
