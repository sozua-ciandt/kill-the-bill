name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Run project checks
        run: make check SWIFT_TEST_FLAGS="--enable-code-coverage --parallel"

      - name: Report coverage
        run: |
          set -euo pipefail
          TEST_BINARY=$(
            find .build \
              -path '*KillTheBillPackageTests.xctest/Contents/MacOS/KillTheBillPackageTests' \
              -type f -print -quit
          )
          COVERAGE_PROFILE=$(
            find .build \
              -path '*/codecov/default.profdata' \
              -type f -print -quit
          )
          test -n "$TEST_BINARY"
          test -n "$COVERAGE_PROFILE"
          xcrun llvm-cov report "$TEST_BINARY" \
            -instr-profile "$COVERAGE_PROFILE" \
            -ignore-filename-regex='Tests|/App/' | tee coverage.txt
